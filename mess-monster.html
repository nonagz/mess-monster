<title>מפלצת הבלגן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: a bathroom-tile world; chunky ink-outlined sticker panels in one phone column; the monster arena is the stage.
   Deliberately single-theme (bright cartoon), so every color is set explicitly. */
:root{
  color-scheme:light;
  --tile:#33B2A5; --tile-dark:#26897F; --grout:rgba(255,255,255,.22);
  --ink:#16161F; --paper:#FFFFFF; --paper-2:#EEF4F2; --muted:#5A6570;
  --pa:#3157FF; --pa-soft:#DEE5FF; --pb:#FF8A1F; --pb-soft:#FFE8D2; --pj:#D63C8E; --pj-soft:#FBDDEE;
  --ok:#139E66; --ok-soft:#D2F4E3; --warn:#E5383B; --warn-soft:#FDE0E0; --gold:#FFC93C;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
}
html,body{background-color:var(--tile);color:var(--ink)}
body{
  font-family:var(--f-body);font-size:16px;line-height:1.5;overflow-x:hidden;
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:46px 46px;background-attachment:fixed;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles i{position:absolute;bottom:-60px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7) 0 12%,rgba(255,255,255,.08) 13%);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}

#app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
#app.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
input{font:inherit;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
input:focus{outline:none;box-shadow:0 0 0 3px var(--gold)}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:14px;animation:popin .45s cubic-bezier(.2,1.5,.5,1) both}
@keyframes popin{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.panel h2{font-size:22px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.err{color:var(--warn);font-size:14px;font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:11px 18px;font-weight:700;background:var(--paper);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,filter .15s;position:relative}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.primary{background:var(--gold)}
.big{font-size:20px;padding:14px 22px;font-family:var(--f-display);font-weight:400}
.small{padding:7px 12px;font-size:14px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
.full{width:100%}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px 14px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-2px)}}
.logo h1{font-size:24px;white-space:nowrap}
.logo .sub{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.hbtns{display:flex;gap:6px;align-items:center}
.icon{width:40px;height:40px;padding:0;border-radius:12px}
.me{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;border:2.5px solid var(--ink);white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0}
.row2 label span{display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}

.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.howto div{background:var(--paper-2);border:2.5px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.howto b{font-family:var(--f-display);font-weight:400;font-size:18px}
.howto span{font-size:13px;color:var(--muted)}
@media (max-width:500px){.howto{grid-template-columns:1fr}}

.deck-edit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.deck-edit li{display:flex;gap:8px;align-items:center;animation:popin .3s both}
.step{display:inline-flex;align-items:center;background:var(--paper-2);border:2.5px solid var(--ink);border-radius:12px;flex:none}
.step button{width:34px;height:38px;font-size:20px;font-weight:700}
.step output{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800}
.del{width:38px;height:38px;font-size:22px;border-radius:12px;flex:none;color:var(--muted)}
.del:hover{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* seat picker */
.seats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);font-family:var(--f-display);font-size:24px;transition:transform .1s}
.seat:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.seat:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.seat small{font-family:var(--f-body);font-size:13px;font-weight:500}
.avatar{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px;color:#fff;font-family:var(--f-display)}

/* balance meter */
.meter{display:flex;flex-direction:column;gap:6px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.meter-top .num{font-family:var(--f-display);font-size:30px;line-height:1;display:inline-block;font-variant-numeric:tabular-nums}
.meter-top .num.bump{animation:bump .4s cubic-bezier(.2,2,.5,1)}
@keyframes bump{40%{transform:scale(1.5)}}
.track{position:relative;height:22px;background:var(--paper-2);border:3px solid var(--ink);border-radius:99px;direction:ltr;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:var(--ok-soft);border-inline:3px dashed var(--ok);box-sizing:border-box;transition:left .4s,width .4s}
.meter.inzone .zone{background:#B8EFD2;animation:zoneglow 1.2s ease-in-out infinite}
@keyframes zoneglow{50%{background:#8FE6BA}}
.mark{position:absolute;top:50%;width:26px;height:26px;margin-left:-13px;margin-top:-13px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);box-sizing:border-box;transition:left .55s cubic-bezier(.25,1.6,.5,1)}
.meter-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500}
.meter-cap .mid{color:var(--ok);font-weight:700}

/* dealing table */
.table{background:var(--tile-dark);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;overflow:hidden;
  background-image:radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),transparent 60%)}
.stack{position:relative;width:min(270px,100%);height:250px;perspective:900px}
.stack .ghostcard{position:absolute;inset:0;background:var(--paper);border:3px solid var(--ink);border-radius:20px}
.card{position:absolute;inset:0;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;animation:flipin .55s cubic-bezier(.2,1.4,.4,1) both;transform-style:preserve-3d;
  background-image:repeating-linear-gradient(45deg,transparent 0 12px,rgba(22,22,31,.03) 12px 24px)}
@keyframes flipin{from{transform:rotateY(100deg) translateY(-30px) scale(.8);opacity:0}60%{opacity:1}to{transform:none}}
.card h2{font-size:30px}
.card .tag{font-size:12px;font-weight:800;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:99px}
.pips{display:flex;gap:6px}
.pip{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);box-sizing:border-box;background:var(--paper)}
.pip.on{background:var(--pj)}
.flycard{position:fixed;z-index:40;pointer-events:none;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;text-align:center;padding:10px;box-sizing:border-box}
.take{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.take .btn{padding:14px 6px;font-size:16px;flex-direction:column;gap:2px;line-height:1.2;min-width:0}
.take .btn small{font-size:12px;font-weight:500;opacity:.85}
.bpa{background:var(--pa);color:#fff} .bpb{background:var(--pb);color:var(--ink)} .bpj{background:var(--pj);color:#fff}
.minor{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.minor .btn{background:rgba(255,255,255,.9)}

.verdict{padding:12px 14px;border-radius:14px;font-weight:700;border:2.5px solid currentColor}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}

.groups{display:flex;flex-direction:column;gap:14px}
.grp h3{font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.grp h3 small{font-family:var(--f-body);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:99px;border:2px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:7px 11px;font-size:14px;font-weight:500;box-shadow:0 3px 0 var(--ink);animation:popin .3s both}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip b{font-variant-numeric:tabular-nums;font-size:12px;background:var(--paper-2);border-radius:6px;padding:0 6px}

/* arena */
.arena{position:relative;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);overflow:hidden;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:radial-gradient(ellipse at 50% 78%,#FFFFFF 0,#E9F1EF 45%,#CFE0DC 100%)}
.arena::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background-image:linear-gradient(rgba(22,22,31,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(22,22,31,.07) 2px,transparent 2px);background-size:30px 30px;transform:perspective(200px) rotateX(35deg);transform-origin:bottom;pointer-events:none}
.nameplate{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.nameplate h2{font-size:28px}
.lvl{font-size:12px;font-weight:800;background:var(--ink);color:var(--gold);padding:3px 10px;border-radius:99px;letter-spacing:.05em}
.mood{font-size:14px;font-weight:700;padding:4px 12px;border-radius:99px;border:2px solid var(--ink);background:var(--paper)}
.mood.angry{background:var(--warn-soft);color:var(--warn);animation:pulse 1s infinite}
.mood.scared{background:var(--ok-soft);color:var(--ok)}
.mwrap{position:relative;width:250px;max-width:100%;height:210px}
.mscale{position:absolute;inset:0;transform-origin:50% 92%;transition:transform .6s cubic-bezier(.3,1.6,.5,1) .45s}
.mhit{position:absolute;inset:0;transform-origin:50% 92%}
.mwrap svg{width:100%;height:100%;overflow:visible}
.breathe{animation:breathe 2.4s ease-in-out infinite;transform-origin:100px 158px;transform-box:view-box}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
.angry .breathe{animation-duration:1.1s}
.lid{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 4.8s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.pupil{transition:transform .12s}
.mwrap.hit .mhit{animation:squash .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes squash{0%{transform:none}15%{transform:scale(1.25,.7)}35%{transform:scale(.85,1.2) rotate(-4deg)}55%{transform:scale(1.08,.94) rotate(3deg)}100%{transform:none}}
.mwrap.hit svg{animation:flash .35s}
@keyframes flash{0%,40%{filter:brightness(2.2) saturate(.2)}100%{filter:none}}
.mwrap.die .mhit{animation:die 1.1s cubic-bezier(.5,-0.4,.7,.4) forwards}
@keyframes die{0%{transform:none}20%{transform:scale(1.15,.85)}40%{transform:scale(.9,1.15) rotate(8deg)}100%{transform:scale(0) rotate(-200deg);opacity:0}}
.mwrap.intro .mhit{animation:dropin .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dropin{0%{transform:translateY(-260px) scale(.6,1.3)}55%{transform:translateY(0) scale(1.3,.7)}75%{transform:scale(.9,1.1)}100%{transform:none}}
.dmg{position:absolute;top:22%;left:50%;font-family:var(--f-display);font-size:46px;color:var(--warn);-webkit-text-stroke:2px var(--ink);pointer-events:none;animation:dmg 1.1s cubic-bezier(.2,1.6,.5,1) forwards;z-index:3}
@keyframes dmg{0%{transform:translate(-50%,10px) scale(.3);opacity:0}25%{transform:translate(-50%,-20px) scale(1.4);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}

.hp{width:100%;display:flex;flex-direction:column;gap:7px;position:relative}
.hprow{display:grid;grid-template-columns:minmax(0,6.5em) 1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:700}
.hprow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hprow .num{font-variant-numeric:tabular-nums;min-width:3.4em;text-align:end}
.bar{position:relative;height:16px;background:var(--paper);border:2.5px solid var(--ink);border-radius:99px;overflow:hidden}
.bar .ghost{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold);transition:width .6s ease 1s}
.bar .fill{position:absolute;inset-block:0;inset-inline-start:0;transition:width .35s ease .45s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);font-size:12px;font-weight:700;min-width:0}
.day.past{background:var(--paper-2);color:var(--muted)}
.day.today{background:var(--gold);transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.day .ds{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:8px}
.day .ds i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink)}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:start;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;width:100%;font-size:15px;font-weight:500;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .2s}
.task:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.task .box{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--ink);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;box-sizing:border-box;background:var(--paper)}
.task .n{min-width:0;overflow-wrap:anywhere}
.task .p{font-family:var(--f-display);color:var(--warn);font-size:17px;font-variant-numeric:tabular-nums}
.task .note{grid-column:2 / 4;font-size:12px;font-weight:700}
.task.done{background:var(--paper-2);box-shadow:0 2px 0 var(--ink)}
.task.done .n{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.task.done .p{color:var(--muted)}
.task.done .box{animation:stamp .4s cubic-bezier(.2,2,.5,1)}
@keyframes stamp{0%{transform:scale(1.8) rotate(-20deg)}100%{transform:none}}
.task.half{background:var(--pj-soft)}
.joint .box{border-radius:50%}
.halves{display:flex;width:26px;height:26px;border:2.5px solid var(--ink);border-radius:50%;overflow:hidden;box-sizing:border-box}
.halves i{flex:1;background:var(--paper)}

.cheer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cheer .btn{font-size:15px}

.banner{position:fixed;left:50%;top:38%;z-index:60;pointer-events:none;font-family:var(--f-display);font-size:clamp(34px,10vw,58px);color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);white-space:nowrap;animation:banner 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.banner small{display:block;text-align:center;font-size:.45em;color:#fff;-webkit-text-stroke:2px var(--ink)}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg)}20%{transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9) rotate(-4deg)}}

.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;font-weight:700;font-size:15px;animation:toastin .5s cubic-bezier(.2,1.6,.4,1) both}
.toast.out{animation:toastout .35s ease-in forwards}
.toast .em{font-size:26px;flex:none}
@keyframes toastin{from{transform:translateY(-40px) scale(.8);opacity:0}}
@keyframes toastout{to{transform:translateY(-30px);opacity:0}}

.combo{position:absolute;top:10px;inset-inline-start:12px;font-family:var(--f-display);font-size:22px;color:var(--pj);-webkit-text-stroke:1.5px var(--ink);animation:bump .5s cubic-bezier(.2,2,.5,1);z-index:2}

.win{align-items:center;text-align:center;overflow:hidden;position:relative}
.stamp{font-family:var(--f-display);font-size:44px;color:var(--warn);border:5px solid var(--warn);border-radius:14px;padding:2px 18px;transform:rotate(-8deg);animation:stampin .6s cubic-bezier(.2,1.8,.4,1) .3s both;background:rgba(255,255,255,.8)}
@keyframes stampin{from{transform:scale(3) rotate(-25deg);opacity:0}}
.reward{width:min(300px,100%);height:150px;perspective:900px;cursor:pointer}
.reward-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.5,.5,1);transform-style:preserve-3d}
.reward.open .reward-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;padding:14px;box-sizing:border-box}
.face.front{background:var(--pj);color:#fff;font-family:var(--f-display);font-size:22px;background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.12) 14px 28px)}
.face.back{background:var(--gold);transform:rotateY(180deg);font-family:var(--f-display);font-size:24px}
.statrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--paper-2);min-width:90px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}

footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
footer span{font-variant-numeric:tabular-nums}

.spinner{width:42px;height:42px;border:5px solid var(--paper-2);border-top-color:var(--pj);border-radius:50%;animation:spin .8s linear infinite}

.card.still{animation:none}
@media (max-width:420px){.logo h1{font-size:20px}.take .btn{font-size:14px}.card h2{font-size:26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  <i style="left:47%;width:34px;height:34px;animation-duration:24s;animation-delay:-14s"></i>
  <i style="left:71%;width:18px;height:18px;animation-duration:16s;animation-delay:-1s"></i>

</div>

<div id="app" dir="rtl" lang="he"></div>

<script>
(function(){
/* ================= constants & helpers ================= */
const KEY='mm-state-v2', DAY=86400000;
const TEMPLATE=[["שטיפת כלים",3],["הפעלת כביסה",2],["תלייה וקיפול כביסה",3],["שאיבת אבק",3],["שטיפת רצפה",4],["ניקוי שירותים ואמבטיה",4],["הוצאת זבל ומחזור",1],["קניות בסופר",3],["בישול ארוחת ערב",4],["החלפת מצעים",2],["ניקוי משטחי מטבח",2],["השקיית עציצים",1]];
const MONSTERS=[
  {name:'גרביליון',sub:'אוכל גרביים בודדות',body:'#8E5BD9',dark:'#5D3A9E',eyes:2,top:'sock'},
  {name:'אבקון',sub:'מתחבא מתחת לספה',body:'#8592A8',dark:'#566179',eyes:1,top:'fuzz'},
  {name:'כלימוש',sub:'גר בכיור כבר שלושה ימים',body:'#3FAE5A',dark:'#24763B',eyes:3,top:'spoon'},
  {name:'ערמונת',sub:'ערמת כביסה שקמה לחיים',body:'#E0506A',dark:'#A1293F',eyes:2,top:'horns'}
];
const PCOL=['var(--pa)','var(--pb)','var(--pj)'], PHEX=['#3157FF','#FF8A1F','#D63C8E'];
const DAYL=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function fresh(){return {v:2,phase:'setup',players:['',''],reward:'',week:1,chores:TEMPLATE.map(([name,pts])=>({id:uid(),name,pts})),draft:null,weekChores:[],weekStart:null,seats:[null,null],history:{}};}
function migrate(o){
  if(!o) return fresh();
  if(o.v===2) return o;
  const f=fresh(); if(Array.isArray(o.players)) f.players=o.players; if(o.reward) f.reward=o.reward; if(Array.isArray(o.chores)&&o.chores.length) f.chores=o.chores; return f;
}
let S=migrate(JSON.parse(ls.get(KEY)||'null'));
let deviceId=ls.get('mm-device'); if(!deviceId){deviceId='dev-'+uid()+uid(); ls.set('mm-device',deviceId);}
let myId=null, identityReady=false;

const ui={edit:null,err:'',status:'',confirm:null,combo:{n:0,t:0},post:[],wasDone:null,doneWeek:null,victoryPlaying:false,intro:false,rewardOpen:false,prev:{},muted:ls.get('mm-muted')==='1'};
const app=document.getElementById('app');
const P=i=>i===2?'ביחד':((S.players[i]||'').trim()||(i?'שחקן/ית ב':'שחקן/ית א'));
const meIdx=()=>{const i=myId?S.seats.indexOf(myId):-1; if(i>=0) return i; const c=ls.get('mm-slot'); return (!myId&&c!==null)?Number(c):null;};
const monster=()=>MONSTERS[(S.week-1)%MONSTERS.length];

/* ================= sound (synth, starts after first tap) ================= */
let ac=null;
function audio(){ if(ui.muted) return null; if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}} if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f,dur,type,vol,slide,delay){const a=audio(); if(!a) return; const t=a.currentTime+(delay||0); const o=a.createOscillator(), g=a.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(vol||.08,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);}
function noise(dur,vol,freq,sweep,delay){const a=audio(); if(!a) return; const t=a.currentTime+(delay||0); const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=a.createBufferSource(); s.buffer=b; const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.frequency.setValueAtTime(freq,t); if(sweep) fl.frequency.exponentialRampToValueAtTime(sweep,t+dur); const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(fl).connect(g).connect(a.destination); s.start(t);}
const sfx={
  tap(){tone(700,.05,'sine',.05,900)},
  flip(){noise(.07,.18,2500,5000)},
  whoosh(){noise(.25,.16,400,3500)},
  hit(){tone(160,.22,'square',.12,55); noise(.12,.2,900,300)},
  pop(){tone(500,.09,'sine',.1,1300)},
  combo(n){[0,4,7,12].forEach((s,i)=>tone(440*Math.pow(2,(s+Math.min(n,8))/12),.13,'triangle',.08,null,i*.06))},
  chime(){[12,16,19,24].forEach((s,i)=>tone(523*Math.pow(2,s/12),.35,'sine',.06,null,i*.07))},
  roar(){tone(110,.7,'sawtooth',.1,45); noise(.6,.12,500,120)},
  win(){[0,4,7,12,7,12,16,19].forEach((s,i)=>tone(523*Math.pow(2,s/12),.2,'square',.05,null,i*.11)); [0,4,7].forEach(s=>tone(523*Math.pow(2,(s+12)/12),.9,'triangle',.05,null,.95))},
  ping(){tone(880,.12,'sine',.08,1320); tone(1320,.15,'sine',.06,null,.1)},
  sad(){tone(300,.3,'triangle',.07,150)}
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ================= particles ================= */
const cv=document.getElementById('fx'), cx=cv.getContext('2d'); let parts=[], running=false, dpr=1;
function size(){dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);} size(); addEventListener('resize',size);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function spawn(p){ if(reduced&&p.type!=='proj') return; parts.push(p); if(!running){running=true; last=performance.now(); requestAnimationFrame(tick);} }
let last=0;
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>{
    p.age+=dt; if(p.age>=p.life){ if(p.onEnd) p.onEnd(); return false; }
    const k=p.age/p.life;
    if(p.type==='proj'){
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; const x=p.x0+(p.x1-p.x0)*e, y=p.y0+(p.y1-p.y0)*e-Math.sin(Math.PI*e)*p.arc;
      p.trail.push([x,y]); if(p.trail.length>12) p.trail.shift();
      p.trail.forEach((t,i)=>{cx.globalAlpha=i/p.trail.length*.6; cx.fillStyle=p.color; cx.beginPath(); cx.arc(t[0],t[1],p.r*(i/p.trail.length),0,7); cx.fill();});
      cx.globalAlpha=1; cx.fillStyle='#fff'; cx.strokeStyle='#16161F'; cx.lineWidth=3; cx.beginPath(); cx.arc(x,y,p.r,0,7); cx.fill(); cx.stroke();
      cx.fillStyle=p.color; cx.beginPath(); cx.arc(x,y,p.r*.55,0,7); cx.fill();
      return true;
    }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=p.drag; p.rot+=p.vr*dt;
    cx.globalAlpha=k>.7?(1-k)/.3:1;
    if(p.type==='conf'){cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.scale(1,Math.cos(p.age*8)); cx.fillStyle=p.color; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore();}
    else if(p.type==='bubble'){cx.strokeStyle='rgba(255,255,255,.95)'; cx.lineWidth=2; cx.fillStyle='rgba(255,255,255,.25)'; cx.beginPath(); cx.arc(p.x+Math.sin(p.age*6+p.rot)*4,p.y,p.r,0,7); cx.fill(); cx.stroke(); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.22,0,7); cx.fill();}
    else if(p.type==='star'){cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.color; cx.strokeStyle='#16161F'; cx.lineWidth=2; cx.beginPath(); for(let i=0;i<10;i++){const r=i%2?p.r*.45:p.r; const a=i*Math.PI/5; cx.lineTo(Math.cos(a)*r,Math.sin(a)*r);} cx.closePath(); cx.fill(); cx.stroke(); cx.restore();}
    else {cx.fillStyle=p.color; cx.strokeStyle='#16161F'; cx.lineWidth=2; cx.beginPath(); cx.arc(p.x,p.y,p.r*(1-k*.5),0,7); cx.fill(); cx.stroke();}
    cx.globalAlpha=1; return true;
  });
  if(parts.length) requestAnimationFrame(tick); else {running=false; cx.clearRect(0,0,innerWidth,innerHeight);}
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(x,y,colors,n,opt){opt=opt||{}; for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2), sp=rnd(opt.min||120,opt.max||420); spawn({type:opt.type||'dot',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(opt.up||120),g:opt.g??700,drag:.985,r:rnd(opt.rmin||4,opt.rmax||9),color:colors[i%colors.length],age:0,life:rnd(.6,opt.life||1.2),rot:rnd(0,6),vr:rnd(-8,8)});}}
function bubbles(x,y,n){for(let i=0;i<n;i++) spawn({type:'bubble',x:x+rnd(-60,60),y:y+rnd(-20,30),vx:rnd(-30,30),vy:rnd(-160,-60),g:-20,drag:.99,r:rnd(5,14),age:0,life:rnd(1,2),rot:rnd(0,6),vr:0});}
function confettiRain(ms){const cols=['#3157FF','#FF8A1F','#D63C8E','#FFC93C','#139E66','#fff']; const end=performance.now()+ms; (function drop(){ for(let i=0;i<6;i++) spawn({type:'conf',x:rnd(0,innerWidth),y:-20,vx:rnd(-60,60),vy:rnd(80,240),g:180,drag:.995,r:rnd(5,9),color:cols[Math.floor(rnd(0,cols.length))],age:0,life:rnd(2.4,3.6),rot:rnd(0,6),vr:rnd(-6,6)}); if(performance.now()<end) setTimeout(drop,60); })();}
function projectile(from,to,color,onArrive){spawn({type:'proj',x0:from[0],y0:from[1],x1:to[0],y1:to[1],arc:rnd(60,140),r:11,color,trail:[],age:0,life:.45,onEnd:onArrive});}
function center(el){const r=el.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2];}

/* ================= juice helpers ================= */
function banner(text,small,color){const b=document.createElement('div'); b.className='banner'; if(color) b.style.color=color; b.innerHTML=esc(text)+(small?`<small>${esc(small)}</small>`:''); document.body.appendChild(b); setTimeout(()=>b.remove(),1600);}
function toast(em,text){const box=document.getElementById('toasts'); const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span class="em" aria-hidden="true">${em}</span><span></span>`; t.lastChild.textContent=text; box.appendChild(t); while(box.children.length>3) box.firstChild.remove(); setTimeout(()=>{t.classList.add('out'); setTimeout(()=>t.remove(),400)},3800);}
function shake(){app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');}
function hitMonster(pts,color,big){
  const w=document.getElementById('mwrap'); if(!w) return;
  w.classList.remove('hit'); void w.offsetWidth; w.classList.add('hit');
  const d=document.createElement('span'); d.className='dmg'; d.textContent='−'+pts; if(big){d.style.fontSize='64px'; d.style.color='var(--pj)';} w.appendChild(d); setTimeout(()=>d.remove(),1200);
  const c=center(w); burst(c[0],c[1]-10,[monster().body,color,'#FFC93C','#fff'],big?44:24,{type:big?'star':'dot',rmax:big?14:9}); bubbles(c[0],c[1],big?14:7);
  shake(); sfx.hit(); buzz(big?[40,40,60]:35);
}

/* ================= persistence ================= */
let db=null, ref=null, saving=false, queued=false, M={}, marksUnsub=null, marksWeek=null, pingUnsub=null, pingFor=null;
let seen=new Set(JSON.parse(ls.get('mm-seen')||'[]')), seenInit=ls.get('mm-seen')!==null;
function saveSeen(){ls.set('mm-seen',JSON.stringify([...seen].slice(-400))); seenInit=true;}
function save(){ ls.set(KEY,JSON.stringify(S)); if(ref) push(); }
async function push(){ if(saving){queued=true;return} saving=true; try{await ref.set(clone(S)); setStatus('מסונכרן');}catch(e){setStatus('השמירה המשותפת נכשלה, נשמר במכשיר')} saving=false; if(queued){queued=false; push();} }
function setStatus(t){ui.status=t; const el=document.getElementById('status'); if(el) el.textContent=t;}
function localMarks(){try{return JSON.parse(ls.get('mm-marks')||'{}')}catch(e){return {}}}
function markId(cid,p){return `w${S.week}-${cid}-${p}`;}
async function putMark(cid,p){const id=markId(cid,p), data={week:S.week,chore:cid,p,at:Date.now()}; M[id]={...data,_id:id}; seen.add(id); saveSeen();
  if(db){try{await db.collection('marks').doc(id).set(data)}catch(e){setStatus('הסימון לא נשמר בענן')}} else {const all=localMarks(); all[id]=data; ls.set('mm-marks',JSON.stringify(all));}}
async function delMark(id){delete M[id]; if(db){try{await db.collection('marks').doc(id).delete()}catch(e){}} else {const all=localMarks(); delete all[id]; ls.set('mm-marks',JSON.stringify(all));}}

function ensureSubs(){
  if(!db){ const all=localMarks(); M={}; Object.entries(all).forEach(([id,m])=>{if(m.week===S.week) M[id]={...m,_id:id}}); return; }
  if(marksWeek!==S.week){
    if(marksUnsub) marksUnsub(); marksWeek=S.week;
    marksUnsub=db.collection('marks').where('week','==',S.week).onSnapshot(snap=>{
      const next={}; snap.docs.forEach(d=>{next[d.id]={...d.data(),_id:d.id}});
      let fresh=[];
      if(!snap.metadata.fromCache){
        if(!seenInit){ Object.keys(next).forEach(id=>seen.add(id)); }
        else fresh=Object.values(next).filter(m=>!seen.has(m._id));
        Object.keys(next).forEach(id=>seen.add(id)); saveSeen();
      }
      const before=M; M=next; render();
      const me=meIdx(); const partner=fresh.filter(m=>m.p!==me).sort((a,b)=>a.at-b.at);
      if(partner.length) replayPartner(partner,before);
    },()=>{});
  }
  const me=meIdx();
  if(me!==null && pingFor!==me){
    if(pingUnsub) pingUnsub(); pingFor=me; let first=true;
    const seenP=Number(ls.get('mm-pings-seen')||0);
    pingUnsub=db.collection('pings').where('to','==',me).onSnapshot(snap=>{
      if(snap.metadata.fromCache) return;
      const all=snap.docs.map(d=>d.data()).filter(x=>x.at>Math.max(seenP,Number(ls.get('mm-pings-seen')||0))).sort((a,b)=>a.at-b.at);
      if(all.length){ ls.set('mm-pings-seen',String(all[all.length-1].at)); all.slice(-3).forEach((x,i)=>setTimeout(()=>receivePing(x),i*900)); }
      first=false;
    },()=>{});
  }
}

(async()=>{
  let user=null;
  const hasHost=!!(window.claude&&window.claude.use);
  if(hasHost){
    try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);}catch(e){}
  }
  try{ myId=user?await user.id():null; }catch(e){ myId=null; }
  if(!myId) myId=deviceId;
  identityReady=true;
  if(!db){ setStatus('נשמר במכשיר הזה בלבד'); ensureSubs(); render(); return; }
  ref=db.doc('game/state');
  const timer=setTimeout(()=>setStatus('לא מצליחים להגיע לשמירה המשותפת כרגע'),10000);
  let settled=false;
  ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer); setStatus('מסונכרן');}
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists){ const d=snap.data(); if(d&&d.v===2&&JSON.stringify(d)!==JSON.stringify(S)){ const oldPhase=S.phase, oldWeek=S.week; S=clone(d); ls.set(KEY,JSON.stringify(S)); if(S.phase==='week'&&(oldPhase!=='week'||oldWeek!==S.week)&&settled) ui.intro=true; ensureSubs(); render(); } }
    else if(!settled&&!snap.metadata.fromCache&&S.phase!=='setup'){ push(); }
    if(!snap.metadata.fromCache) settled=true;
  },()=>{clearTimeout(timer); ref=null; setStatus('נשמר במכשיר הזה');});
  ensureSubs(); render();
})();

/* ================= game logic ================= */
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function startDraft(){ S.draft={deck:shuffle(S.chores).map(c=>({id:c.id,name:c.name,pts:c.pts})),idx:0}; S.weekChores=[]; S.phase='draft'; S.weekStart=null; ui.confirm=null; ui.rewardOpen=false; }
function totals(list){const t=[0,0,0]; list.forEach(c=>{if(c.owner>=0) t[c.owner]+=c.pts}); return t;}
function soloTotal(){ const d=S.draft; if(!d) return 0; const taken=new Map(S.weekChores.map(c=>[c.id,c.owner])); return d.deck.reduce((s,c)=>{const o=taken.get(c.id); return s+((o===-1||o===2)?0:c.pts)},0); }
const zoneFor=t=>Math.max(2,Math.round(t*.12));
function st(c){
  const ms=Object.values(M).filter(m=>m.chore===c.id&&m.week===S.week);
  if(c.owner===2){const conf=[ms.some(m=>m.p===0),ms.some(m=>m.p===1)]; return {done:conf[0]&&conf[1],conf,ms};}
  const first=ms.slice().sort((a,b)=>a.at-b.at)[0]; return {done:!!first,by:first?first.p:null,ms};
}
function weekStats(){
  const list=S.weekChores.filter(c=>c.owner>=0), tot=[0,0,0], rem=[0,0,0];
  list.forEach(c=>{tot[c.owner]+=c.pts; if(!st(c).done) rem[c.owner]+=c.pts;});
  const all=tot[0]+tot[1]+tot[2], left=rem[0]+rem[1]+rem[2];
  return {list,tot,rem,all,left,allDone:list.length>0&&left===0};
}
function dayIndex(){ if(!S.weekStart) return 0; const s=new Date(S.weekStart); s.setHours(0,0,0,0); return Math.floor((Date.now()-s.getTime())/DAY); }
function pace(ws){
  const di=dayIndex(), expected=clamp((di+1)/7,0,1), done=ws.all?(ws.all-ws.left)/ws.all:0;
  if(di>=7) return {mood:'over',text:'השבוע נגמר'};
  if(done>=expected) return {mood:'scared',text:'המפלצת מתחילה לפחד'};
  if(done<expected-.15) return {mood:'angry',text:'המפלצת מתחזקת!'};
  return {mood:'normal',text:'המפלצת מחכה לכם'};
}
function streak(){let n=0; for(let w=S.week-(S.history[S.week]?0:1); w>=1; w--){ if(S.history[w]) n++; else break; } return n;}

async function mark(c,btn){
  const me=meIdx(); if(me===null) return;
  const before=st(c);
  if(c.owner===2){ const id=markId(c.id,me); if(M[id]) await delMark(id), sfx.tap(); else await putMark(c.id,me); }
  else if(before.done){ for(const m of before.ms) await delMark(m._id); sfx.tap(); }
  else await putMark(c.id,me);
  const after=st(c);
  const from=center(btn);
  render();
  if(!before.done&&after.done){
    const now=Date.now(); ui.combo.n=(now-ui.combo.t<90000)?ui.combo.n+1:1; ui.combo.t=now;
    const w=document.getElementById('mwrap'); const to=w?center(w):[innerWidth/2,200];
    const joint=c.owner===2;
    sfx.whoosh();
    projectile(from,to,PHEX[joint?2:c.owner],()=>{
      hitMonster(c.pts,PHEX[joint?2:c.owner],joint);

      if(!joint&&c.owner!==me) setTimeout(()=>toast('❤️',`עזרת ל${P(c.owner)}! לב עזרה נוסף`),500);
    });
  } else if(c.owner===2&&after.conf[me]&&!after.done){
    sfx.pop(); bubbles(from[0],from[1],10); toast('⏳',`סימנת. מחכים ש${P(1-me)} יאשר/תאשר כדי לשחרר התקפה משותפת`);

async function replayPartner(list,before){
  const me=meIdx();
  if(list.length>3){ const pts=list.reduce((s,m)=>{const c=S.weekChores.find(x=>x.id===m.chore); return s+(c?c.pts:0)},0); toast('🧹',`בזמן שלא היית: ${P(list[0].p)} סימן/ה ${list.length} מטלות`); }
  for(const m of list.slice(-4)){
    const c=S.weekChores.find(x=>x.id===m.chore); if(!c) continue;
    const s=st(c), joint=c.owner===2;
    if(joint&&!s.done){ toast('🤝',`${P(m.p)} סימן/ה "${c.name}". חסר רק האישור שלך!`); sfx.ping(); await wait(900); continue; }
    if(!s.done) continue;
    toast(joint?'💥':'🧽',`${P(m.p)} ${joint?'השלים/ה איתך':'ביצע/ה'}: ${c.name}`);
    const w=document.getElementById('mwrap');
    if(w){ const to=center(w); await new Promise(r=>projectile([to[0]+(m.p===0?140:-140),-20],to,PHEX[joint?2:c.owner],()=>{hitMonster(c.pts,PHEX[joint?2:c.owner],joint); if(joint) banner('התקפה משותפת!'); r();})); }

  }
}

function meter(t,total,bumpIdx){

    <div class="track"><div class="zone" style="left:${50-zw/2}%;width:${zw}%"></div><div class="mark" data-anim="meter" data-prop="left" data-to="${pos}%"></div></div>
    <div class="meter-cap"><span>עמוס על ${esc(P(0))}</span><span class="mid">אזור האיזון ±${zone}</span><span>עמוס על ${esc(P(1))}</span></div>

}

      if(!s.done&&(s.conf[0]||s.conf[1])){ cls='half'; note=`<span class="note" style="color:var(--pj)">${s.conf[me]?`מחכים לאישור של ${esc(P(1-me))}`:`${esc(P(s.conf[0]?0:1))} כבר סימן/ה. נשאר האישור שלך!`}</span>`; }
    } else { box=`<span class="box" style="${s.done?`background:${PCOL[s.by]}`:''}">${s.done?'✓':''}</span>`;
      if(s.done&&s.by!==c.owner) note=`<span class="note" style="color:var(--warn)">❤️ ${esc(P(s.by))} עזר/ה</span>`; }
    return `<button class="task ${joint?'joint':''} ${s.done?'done':''} ${cls}" data-act="mark" data-id="${c.id}" aria-pressed="${s.done}">${box}<span class="n">${esc(c.name)}</span><span class="p">−${c.pts}</span>${note}</button>`;};
  const group=(title,items,col)=>items.length?`<div class="grp"><h3 style="color:${col}">${title} <small>${items.filter(c=>st(c).done).length}/${items.length}</small></h3><div class="tasks">${items.map(task).join('')}</div></div>`:'';
  const mine=ws.list.filter(c=>c.owner===me), joint=ws.list.filter(c=>c.owner===2), theirs=ws.list.filter(c=>c.owner===1-me);
  return `
  <div class="arena ${pc.mood}">
    ${ui.combo.n>=2&&Date.now()-ui.combo.t<90000?`<span class="combo">קומבו ×${ui.combo.n}</span>`:''}
    <div class="nameplate"><span class="lvl">רמה ${S.week}</span><h2>${esc(m.name)}</h2><span class="hint">${esc(m.sub)}</span></div>
    <div class="mwrap ${ui.intro?'intro':''}" id="mwrap"><div class="mscale" data-anim="mscale" data-prop="transform" data-to="scale(${scale})"><div class="mhit">${monsterSVG(m,pc.mood)}</div></div></div>
    <span class="mood ${pc.mood}">${esc(pc.text)} · נשארו ${ws.left} נק׳${di<7?` ו־${7-di} ימים`:''}</span>
    <div class="hp">${hp(0)}${hp(2)}${hp(1)}</div>
  </div>
  ${di>=7?`<section class="panel"><p class="verdict warn">השבוע נגמר והמפלצת שרדה הפעם. אפשר להמשיך לנקות, או לחלק מחדש.</p><button class="btn primary" data-act="newweek">חלוקה לשבוע ${S.week+1}</button></section>`:''}
  <section class="panel" style="animation-delay:.05s">
    <div class="days">${days}</div>
    ${group('המשימות שלי',mine,PCOL[me])}
    ${group('ביחד',joint,PCOL[2])}
    ${group('של '+esc(P(1-me)),theirs,PCOL[1-me])}
    <p class="hint">עשית מטלה של ${esc(P(1-me))}? סמנו אותה, והיא תיחשב לצד שלהם עם לב עזרה ממך. מטלה משותפת יוצאת לדרך רק כששניכם מאשרים.</p>
  </section>
  <div class="cheer">
    <button class="btn" data-act="ping" data-k="cheer">🙌 כיף ל${esc(P(1-me))}</button>
    <button class="btn" data-act="ping" data-k="thanks">❤️ תודה ל${esc(P(1-me))}</button>
  </div>
  <div class="minor"><button class="btn small" data-act="reset">${ui.confirm==='reset'?'בטוח? לחיצה נוספת פותחת חלוקה חדשה':'לסיים את השבוע ולחלק מחדש'}</button></div>`;
}

function viewWon(){
  const ws=weekStats(), m=monster();
  const helps=[0,1].map(i=>ws.list.filter(c=>{const s=st(c); return c.owner<2&&s.done&&s.by===i&&c.owner!==i;}).length);
  return `
  <section class="panel win">
    <p class="eyebrow">שבוע ${S.week} · רמה ${S.week}</p>
    <div class="stamp">הובס!</div>
    <h2 style="font-size:32px">${esc(m.name)} ברח מהבית</h2>
    <div class="reward ${ui.rewardOpen?'open':''}" data-act="reward" role="button" tabindex="0" aria-label="חשיפת הפרס">
      <div class="reward-in"><div class="face front">לחצו לגלות את הפרס</div><div class="face back">${esc(S.reward||'תבחרו יחד משהו כיף')}</div></div>
    </div>
    <div class="statrow">
      <div class="stat"><b>${ws.list.length}</b><span>מטלות</span></div>
      <div class="stat"><b>${ws.all}</b><span>נזק כולל</span></div>
      <div class="stat"><b>${helps[0]+helps[1]}</b><span>לבבות עזרה</span></div>
      <div class="stat"><b>${streak()}</b><span>שבועות ברצף</span></div>
    </div>
    <button class="btn primary big pulse" data-act="newweek">לשבוע ${S.week+1}: מפלצת חדשה</button>
  </section>`;
}

function render(){
  const me=meIdx(), ws=S.phase==='week'?weekStats():null;
  if(S.phase==='setup'&&!ui.edit) ui.edit=clone({players:S.players,reward:S.reward,chores:S.chores});
  let body, screen;
  if(ui.edit){ body=viewSetup(); screen='setup'; }
  else if(!identityReady){ body=viewLoading(); screen='loading'; }
  else if(me===null||me<0){ body=viewSeat(); screen='seat'; }
  else if(S.phase==='draft'){ body=viewDraft(); screen='draft'; }
  else {
    if(ui.doneWeek!==S.week){ ui.doneWeek=S.week; ui.wasDone=ws.allDone&&ls.get('mm-won-'+S.week)==='1'; }
    if(ws.allDone&&!ui.wasDone&&!ui.victoryPlaying){ ui.post.push(victory); }
    if(!ws.allDone) ui.wasDone=false;
    if(ws.allDone&&ui.wasDone&&!ui.victoryPlaying){ body=viewWon(); screen='won'; }
    else { body=viewWeek(); screen='week'; }
  }
  app.classList.toggle('still',ui.lastScreen===screen); ui.lastScreen=screen;
  const sub=S.phase==='setup'?'משחק מטלות בית לזוג':`שבוע ${S.week} · ${{draft:'חלוקה',week:'קרב'}[S.phase]||''}`;
  app.innerHTML=`
  <header>
    <div class="logo">${logo()}<div><h1>מפלצת הבלגן</h1><p class="sub">${esc(sub)}</p></div></div>
    <div class="hbtns">
      ${me!==null&&me>=0&&S.phase!=='setup'?`<span class="me" style="background:${me?'var(--pb-soft)':'var(--pa-soft)'}"><i class="dot" style="background:${PCOL[me]}"></i>${esc(P(me))}</span>`:''}
      <button class="btn icon" data-act="mute" aria-label="${ui.muted?'הפעלת צלילים':'השתקת צלילים'}">${ui.muted?'🔇':'🔊'}</button>
      ${S.phase!=='setup'&&!ui.edit?`<button class="btn icon" data-act="settings" aria-label="הגדרות">⚙️</button>`:''}
    </div>
  </header>
  ${body}
  <footer><span>${Object.keys(S.history).length} מפלצות הובסו · רצף ${streak()}</span><span id="status">${esc(ui.status)}</span></footer>`;
  // animate values from their previous rendered state
  app.querySelectorAll('[data-anim]').forEach(el=>{const k=el.dataset.anim, p=el.dataset.prop, to=el.dataset.to; const from=ui.prev[k]??to; el.style[p]=from; ui.prev[k]=to; if(from!==to){ void el.offsetWidth; requestAnimationFrame(()=>{el.style[p]=to;}); }});
  if(screen!=='week'){ ['mscale','f0','f1','f2','g0','g1','g2'].forEach(k=>delete ui.prev[k]); }
  if(screen==='week'&&ui.intro){ ui.intro=false; setTimeout(()=>{sfx.roar(); shake(); banner(monster().name+' הופיע/ה!','רמה '+S.week); buzz([80,40,80]);},450); }
  ui.bump=null;
  const post=ui.post; ui.post=[]; post.forEach(f=>f());
}

/* ================= events ================= */
app.addEventListener('input',ev=>{const el=ev.target, k=el.dataset.edit; if(!k||!ui.edit) return;
  if(k==='p0') ui.edit.players[0]=el.value; else if(k==='p1') ui.edit.players[1]=el.value; else if(k==='reward') ui.edit.reward=el.value;
  else if(k==='name'){const c=ui.edit.chores.find(x=>x.id===el.dataset.id); if(c) c.name=el.value;}});

function flyCard(owner){
  const card=document.getElementById('card'); if(!card) return;
  const r=card.getBoundingClientRect(); const f=document.createElement('div'); f.className='flycard'; f.textContent=card.querySelector('h2').textContent;
  Object.assign(f.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'}); document.body.appendChild(f);
  const target=document.querySelector(`[data-act="take"][data-o="${owner}"]`); const tr=target?target.getBoundingClientRect():{left:r.left,top:innerHeight,width:0,height:0};
  const dx=tr.left+tr.width/2-(r.left+r.width/2), dy=tr.top+tr.height/2-(r.top+r.height/2);
  const anim=f.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.15) rotate(${owner===0?40:owner===1?-40:0}deg)`,opacity:.6}],{duration:reduced?1:420,easing:'cubic-bezier(.5,-0.3,.7,1)'});
  anim.onfinish=()=>{f.remove(); const c=target?center(target):[innerWidth/2,innerHeight/2]; burst(c[0],c[1],[PHEX[owner]||'#fff','#fff','#FFC93C'],14,{rmax:7,up:200});};
}

app.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, id=b.dataset.id, o=Number(b.dataset.o), dd=Number(b.dataset.d);
  audio();
  let persist=true;
  const keepConfirm=(a==='reset'||a==='wipe'||a==='seat'); if(!keepConfirm) ui.confirm=null;
  switch(a){
    case 'mute': ui.muted=!ui.muted; ls.set('mm-muted',ui.muted?'1':'0'); if(!ui.muted) sfx.pop(); persist=false; break;
    case 'settings': ui.edit=clone({players:S.players,reward:S.reward,chores:S.chores}); ui.err=''; persist=false; sfx.tap(); break;
    case 'ecancel': ui.edit=null; ui.err=''; persist=false; break;
    case 'ept': {const c=ui.edit.chores.find(x=>x.id===id); if(c) c.pts=clamp(c.pts+dd,1,5); persist=false; sfx.tap(); break;}
    case 'edel': ui.edit.chores=ui.edit.chores.filter(x=>x.id!==id); persist=false; sfx.pop(); break;
    case 'eadd': ui.edit.chores.push({id:uid(),name:'',pts:2}); render(); {const inp=app.querySelector('.deck-edit li:last-child input'); if(inp) inp.focus();} sfx.pop(); return;
    case 'esave': {
      const chores=ui.edit.chores.map(c=>({...c,name:c.name.trim()})).filter(c=>c.name);
      if(chores.length<2){ui.err='צריך לפחות שתי מטלות בחפיסה.'; persist=false; break;}
      S.players=ui.edit.players.map(p=>p.trim()); S.reward=ui.edit.reward.trim(); S.chores=chores;
      if(S.phase==='setup'){ startDraft(); sfx.chime(); confettiBurstTop('cheer'); }
      ui.edit=null; ui.err=''; break;
    }
    case 'seat': {
      const taken=S.seats[o]&&S.seats[o]!==myId;
      if(taken&&ui.confirm!=='seat'+o){ ui.confirm='seat'+o; persist=false; break; }
      S.seats=S.seats.map(s=>s===myId?null:s); S.seats[o]=myId; ls.set('mm-slot',String(o)); ui.confirm=null;
      sfx.chime(); setTimeout(()=>{banner('שלום '+P(o)+'!'); confettiBurstTop('cheer');},100); ensureSubsLater(); break;
    }
    case 'unseat': { const me=meIdx(); if(me!==null&&me>=0) S.seats[me]=null; ls.del('mm-slot'); ui.edit=null; break; }
    case 'wipe': if(ui.confirm!=='wipe'){ui.confirm='wipe'; persist=false; break;} { const seats=S.seats; S=fresh(); S.seats=seats; ui.edit=null; ui.confirm=null; ui.prev={}; } break;
    case 'dpt': {const c=S.draft.deck[S.draft.idx]; if(c) c.pts=clamp(c.pts+dd,1,5); sfx.tap(); break;}
    case 'take': {
      const d=S.draft, c=d.deck[d.idx]; if(!c) return;
      if(o>=0) flyCard(o); sfx.whoosh(); buzz(15);
      const tBefore=totals(S.weekChores);
      S.weekChores.push({id:c.id,name:c.name,pts:c.pts,owner:o}); d.idx++;
      ui.bump=o>=0&&o<2?o:null;
      const t=totals(S.weekChores);
      setTimeout(sfx.flip,180);
      if(o>=0&&o<2&&t[0]===t[1]&&t[0]>0&&tBefore[0]!==tBefore[1]) setTimeout(()=>{banner('מאוזן בדיוק!'); sfx.chime();},350);
      if(d.idx===d.deck.length) setTimeout(()=>{ const tot=soloTotal(); if(Math.abs(t[0]-t[1])<=zoneFor(tot)){ sfx.chime(); confettiBurstTop('cheer'); } else sfx.sad(); },400);
      break;
    }
    case 'undo': { const d=S.draft; if(!d||d.idx===0) return; d.idx--; const cid=d.deck[d.idx].id; S.weekChores=S.weekChores.filter(c=>c.id!==cid); sfx.tap(); break; }
    case 'move': { const c=S.weekChores.find(x=>x.id===id); if(c&&c.owner>=0) c.owner=c.owner===0?1:c.owner===1?2:0; sfx.pop(); const r=center(b); burst(r[0],r[1],[PHEX[c.owner],'#fff'],10,{rmax:6}); break; }
    case 'startweek': S.weekChores=S.weekChores.filter(c=>c.owner>=0); S.draft=null; S.phase='week'; S.weekStart=Date.now(); ui.intro=true; ui.prev={}; ui.doneWeek=null; break;
    case 'mark': { const c=S.weekChores.find(x=>x.id===id); if(c) await mark(c,b); return; }
    case 'ping': sendPing(b.dataset.k); return;
    case 'reward': if(!ui.rewardOpen){ ui.rewardOpen=true; b.classList.add('open'); sfx.chime(); const c=center(b); setTimeout(()=>burst(c[0],c[1],['#FFC93C','#D63C8E','#3157FF','#fff'],50,{type:'star',max:520}),400); } return;
    case 'reset': if(ui.confirm!=='reset'){ui.confirm='reset'; persist=false; break;} S.week++; startDraft(); ui.confirm=null; break;
    case 'newweek': S.week++; startDraft(); ui.doneWeek=null; ui.wasDone=null; sfx.flip(); break;
    default: return;
  }
  if(persist){ save(); ensureSubs(); }
  render();
});
app.addEventListener('keydown',ev=>{ if((ev.key==='Enter'||ev.key===' ')&&ev.target.dataset&&ev.target.dataset.act==='reward'){ev.preventDefault(); ev.target.click();} });
function ensureSubsLater(){ setTimeout(ensureSubs,0); }

/* monster eyes follow your finger */
addEventListener('pointermove',ev=>{
  const svg=document.querySelector('#mwrap svg'); if(!svg) return; const r=svg.getBoundingClientRect();
  svg.querySelectorAll('.pupil').forEach(p=>{const x=r.left+(+p.dataset.x)/200*r.width, y=r.top+((+p.dataset.y)+30)/200*r.height; const dx=ev.clientX-x, dy=ev.clientY-y, d=Math.hypot(dx,dy)||1, m=(+p.dataset.r)*.35; p.style.transform=`translate(${dx/d*m}px,${dy/d*m}px)`;});
},{passive:true});

/* the week is long: re-render the clock-based parts every few minutes and when the phone wakes */
setInterval(()=>{ if(S.phase==='week'&&!ui.edit&&!document.querySelector('input:focus')) render(); },300000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!ui.edit) render(); });

ensureSubs();
if(!(window.claude&&window.claude.use)){ myId=deviceId; identityReady=true; setStatus('נשמר במכשיר הזה בלבד'); }
render();
})();
</script>
